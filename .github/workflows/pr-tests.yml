name: PR Tests

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, intl, pdo_sqlite, sqlite3, dom, fileinfo, zip

      - name: Validate composer.json and composer.lock
        run: composer validate --no-interaction --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm run build

      - name: Prepare environment
        run: |
          cp .env.testing .env || true
          php artisan key:generate --ansi
          php artisan config:clear --ansi
          mkdir -p database
          touch database/database.sqlite

      - name: Run database migrations (testing)
        run: php artisan migrate --graceful --no-interaction --ansi

      - name: Run deptrac
        run: composer deptrac

      - name: Run JS tests
        run: pnpm run test

      - name: Run tests
        run: php artisan test:parallel
