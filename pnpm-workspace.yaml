# Allow dependency install scripts.
# Packages not listed here cannot run postinstall/preinstall builds.
# Do not use interactive `pnpm approve-builds` for day-to-day setup —
# edit this file (or run `pnpm approve-builds <name>` and commit) when a
# new dependency genuinely needs a build.
allowBuilds:
  esbuild: true

# Supply-chain delay: a version must be published for 48 h before it can be
# installed (pnpm 12 defaults to 24 h). See docs/adr/0001-use-pnpm.md.
minimumReleaseAge: 2880

audit:
  ignore:
    # Quill XSS via HTML export (low). No fixed release exists; the exported
    # HTML is sanitized server-side with HTML Purifier before storage/render.
    # Remove once a patched quill is out.
    - GHSA-v3m3-f69x-jf25
