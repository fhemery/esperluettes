deptrac:
  paths:
    - ./app/Domains
  exclude_files:
    - 'vendor/.*'

  layers:
    # Shared contracts and DTOs - accessible by all domains
    - name: Shared
      collectors:
        - type: directory
          value: 'app/Domains/Shared/'

    # Test helpers - can be shared between domain tests
    - name: TestHelpers
      collectors:
        - type: directory
          value: 'app/Domains/Shared/Testing/'

    # Administration Domain
    # This is the domain that will replace admin (Filament) on the long run
    - name: AdministrationPublic
      collectors:
        - type: directory
          value: 'app/Domains/Administration/Public/'

    - name: AdministrationPrivate
      collectors:
        - type: directory
          value: 'app/Domains/Administration/Private/'

    - name: AdministrationTests
      collectors:
        - type: directory
          value: 'app/Domains/Administration/Tests/'

    # Auth Domain
    - name: AuthPublic
      collectors:
        - type: directory
          value: 'app/Domains/Auth/Public/Api/'
        - type: directory
          value: 'app/Domains/Auth/Public/Events/'

    - name: AuthPrivate
      collectors:
        - type: bool
          must_not:
            - type: directory
              value: app/Domains/Auth/Public/
            - type: directory
              value: app/Domains/Auth/Tests/
          must:
            - type: directory
              value: app/Domains/Auth/

    - name: AuthTests
      collectors:
        - type: directory
          value: 'app/Domains/Auth/Tests/'

    # Comment Domain
    - name: CommentPublic
      collectors:
        - type: directory
          value: 'app/Domains/Comment/Public/'

    - name: CommentPrivate
      collectors:
        - type: directory
          value: app/Domains/Comment/Private/

    - name: CommentTests
      collectors:
        - type: directory
          value: 'app/Domains/Comment/Tests/'

    # Calendar domain
    - name: CalendarPublic
      collectors:
        - type: directory
          value: 'app/Domains/Calendar/Public/'

    - name: CalendarPrivate
      collectors:
        - type: directory
          value: app/Domains/Calendar/Private/

    - name: CalendarTests
      collectors:
        - type: directory
          value: app/Domains/Calendar/Tests/

    # Config Domain
    - name: ConfigPublic
      collectors:
        - type: directory
          value: 'app/Domains/Config/Public/'

    - name: ConfigPrivate
      collectors:
        - type: directory
          value: app/Domains/Config/Private/

    - name: ConfigTests
      collectors:
        - type: directory
          value: app/Domains/Config/Tests/

    # Dashboard Domain
    - name: DashboardPublic
      collectors:
        - type: directory
          value: 'app/Domains/Dashboard/Public/'

    - name: DashboardPrivate
      collectors:
        - type: directory
          value: app/Domains/Dashboard/Private/

    # Events domains
    - name: EventsPublic
      collectors:
        - type: directory
          value: app/Domains/Events/Public/
        
    - name: EventsPrivate
      collectors:
        - type: directory
          value: app/Domains/Events/Private/

    - name: EventsTests
      collectors:
        - type: directory
          value: app/Domains/Events/Tests/

    # Discord Domain
    - name: DiscordPublic
      collectors:
        - type: directory
          value: 'app/Domains/Discord/Public/'

    - name: DiscordPrivate
      collectors:
        - type: directory
          value: app/Domains/Discord/Private/

    - name: DiscordTests
      collectors:
        - type: directory
          value: 'app/Domains/Discord/Tests/'

    # FAQ Domain
    - name: FAQPublic
      collectors:
        - type: directory
          value: app/Domains/FAQ/Public/

    - name: FAQPrivate
      collectors:
        - type: directory
          value: app/Domains/FAQ/Private/

    - name: FAQTests
      collectors:
        - type: directory
          value: app/Domains/FAQ/Tests/

    # Search Domain
    - name: SearchPublic
      collectors:
        - type: directory
          value: 'app/Domains/Search/Public/'

    - name: SearchPrivate
      collectors:
        - type: directory
          value: app/Domains/Search/Private/

    - name: SearchTests
      collectors:
        - type: directory
          value: 'app/Domains/Search/Tests/'

    # Settings Domain
    - name: SettingsPublic
      collectors:
        - type: directory
          value: 'app/Domains/Settings/Public/'

    - name: SettingsPrivate
      collectors:
        - type: directory
          value: app/Domains/Settings/Private/

    - name: SettingsTests
      collectors:
        - type: directory
          value: 'app/Domains/Settings/Tests/'

    # Home Domain
    - name: HomePublic
      collectors:
        - type: directory
          value: 'app/Domains/Home/Public/'

    - name: HomePrivate
      collectors:
        - type: directory
          value: app/Domains/Home/Private/

    # Message Domain
    - name: MessagePublic
      collectors:
        - type: directory
          value: app/Domains/Message/Public/

    - name: MessagePrivate
      collectors:
        - type: directory
          value: app/Domains/Message/Private/

    - name: MessageTests
      collectors:
        - type: directory
          value: app/Domains/Message/Tests/

    #Moderation Domain
    - name: ModerationPublic
      collectors:
        - type: directory
          value: 'app/Domains/Moderation/Public/'

    - name: ModerationPrivate
      collectors:
        - type: directory
          value: app/Domains/Moderation/Private/

    - name: ModerationTests
      collectors:
        - type: directory
          value: app/Domains/Moderation/Tests/

    # News Domain
    - name: NewsPublic
      collectors:
        - type: directory
          value: 'app/Domains/News/Public/'

    - name: NewsPrivate
      collectors:
        - type: directory
          value: app/Domains/News/Private/

    - name: NewsTests
      collectors:
        - type: directory
          value: 'app/Domains/News/Tests/'

    # Notification Domain
    - name: NotificationPublic
      collectors:
        - type: directory
          value: 'app/Domains/Notification/Public/'

    - name: NotificationPrivate
      collectors:
        - type: directory
          value: app/Domains/Notification/Private/

    - name: NotificationTests
      collectors:
        - type: directory
          value: app/Domains/Notification/Tests/

    # Profile Domain
    - name: ProfilePublic
      collectors:
        - type: directory
          value: 'app/Domains/Profile/Public/'

    - name: ProfilePrivate
      collectors:
        - type: directory
          value: 'app/Domains/Profile/Private/'

    - name: ProfileTests
      collectors:
        - type: directory
          value: 'app/Domains/Profile/Tests/'

    # Follow Domain
    - name: FollowPublic
      collectors:
        - type: directory
          value: 'app/Domains/Follow/Public/'

    - name: FollowPrivate
      collectors:
        - type: directory
          value: 'app/Domains/Follow/Private/'

    - name: FollowTests
      collectors:
        - type: directory
          value: 'app/Domains/Follow/Tests/'

    # ReadList Domain
    - name: ReadListPublic
      collectors:
        - type: directory
          value: 'app/Domains/ReadList/Public/'

    - name: ReadListPrivate
      collectors:
        - type: directory
          value: 'app/Domains/ReadList/Private/'

    - name: ReadListTests
      collectors:
        - type: directory
          value: 'app/Domains/ReadList/Tests/'

    # StaticPage Domain
    - name: StaticPagePublic
      collectors:
        - type: directory
          value: 'app/Domains/StaticPage/Public/'

    - name: StaticPagePrivate
      collectors:
        - type: directory
          value: app/Domains/StaticPage/Private/

    - name: StaticPageTests
      collectors:
        - type: directory
          value: 'app/Domains/StaticPage/Tests/'

    # Story Domain
    - name: StoryPublic
      collectors:
        - type: directory
          value: 'app/Domains/Story/Public/'

    - name: StoryPrivate
      collectors:
        - type: directory
          value: 'app/Domains/Story/Private/'

    - name: StoryTests
      collectors:
        - type: directory
          value: 'app/Domains/Story/Tests/'

    - name: StoryRefPublic
      collectors:
        - type: directory
          value: app/Domains/StoryRef/Public/

    - name: StoryRefPrivate
      collectors:
        - type: directory
          value: app/Domains/StoryRef/Private/

    - name: StoryRefTests
      collectors:
        - type: directory
          value: app/Domains/StoryRef/Tests/

    # Statistics Domain
    - name: StatisticsPublic
      collectors:
        - type: directory
          value: 'app/Domains/Statistics/Public/'

    - name: StatisticsPrivate
      collectors:
        - type: directory
          value: 'app/Domains/Statistics/Private/'

    - name: StatisticsTests
      collectors:
        - type: directory
          value: 'app/Domains/Statistics/Tests/'

    # Quote Domain
    - name: QuotePublic
      collectors:
        - type: directory
          value: 'app/Domains/Quote/Public/'

    - name: QuotePrivate
      collectors:
        - type: directory
          value: 'app/Domains/Quote/Private/'

    - name: QuoteTests
      collectors:
        - type: directory
          value: 'app/Domains/Quote/Tests/'

    # Media Domain
    - name: MediaPublic
      collectors:
        - type: directory
          value: 'app/Domains/Media/Public/'

    - name: MediaPrivate
      collectors:
        - type: directory
          value: 'app/Domains/Media/Private/'

    - name: MediaTests
      collectors:
        - type: directory
          value: 'app/Domains/Media/Tests/'

    # Editor Domain
    - name: EditorPublic
      collectors:
        - type: directory
          value: 'app/Domains/Editor/Public/'

    - name: EditorPrivate
      collectors:
        - type: directory
          value: 'app/Domains/Editor/Private/'

    - name: EditorTests
      collectors:
        - type: directory
          value: 'app/Domains/Editor/Tests/'

  ruleset:
    # Shared contracts and DTOs - accessible by all domains
    Shared:
      - SettingsPublic
      - ConfigPublic

    # Test helpers - accessible by all domain tests
    TestHelpers: [ ]

    # ###################################################
    # Public APIs - can only depend on Shared and their own domain
    # ###################################################
    AdministrationPublic:
      - Shared
      - AdministrationPrivate
      - AuthPublic

    AuthPublic:
      - Shared
      - AuthPrivate
      - EventsPublic

    CalendarPublic:
      - Shared
      - CalendarPrivate
      - AuthPublic
      - AdministrationPublic
      - MediaPublic

    CommentPublic: 
      - Shared
      - AuthPublic
      - CommentPrivate
      - EventsPublic
      - ModerationPublic

    ConfigPublic:
      - Shared
      - ConfigPrivate
      - EventsPublic
      - AuthPublic
      - AdministrationPublic

    DashboardPublic:
      - Shared
      - DashboardPrivate

    EventsPublic:
      - Shared
      - EventsPrivate
      - AuthPublic
      - AdministrationPublic

    DiscordPublic:
      - AuthPublic
      - Shared
      - DiscordPrivate
      - EventsPublic
      - NotificationPublic
      - ConfigPublic

    FAQPublic:
      - Shared
      - FAQPrivate
      - AuthPublic

    HomePublic:
      - Shared
      - HomePrivate

    MessagePublic:
      - Shared
      - MessagePrivate
      - EventsPublic

    ModerationPublic:
      - Shared
      - ModerationPrivate
      - EventsPublic
      - AuthPublic
      - AdministrationPublic

    NewsPublic:
      - AuthPublic
      - Shared
      - NewsPrivate
      # NewsServiceProvider registers the news comment policy
      - CommentPublic
      - EventsPublic
      - AdministrationPublic
      - MediaPublic
      - NotificationPublic

    NotificationPublic:
      - Shared
      - NotificationPrivate
      - AuthPublic
      - EventsPublic
      - SettingsPublic

    ProfilePublic:
      - Shared
      - ProfilePrivate
      - AuthPublic
      - EventsPublic
      - ModerationPublic
      - SettingsPublic

    FollowPublic:
      - Shared
      - FollowPrivate
      - AuthPublic
      - EventsPublic
      - NotificationPublic
      - SettingsPublic
      - StoryPublic
      # Registers the following profile tab
      - ProfilePublic

    ReadListPublic:
      - Shared
      - ReadListPrivate
      - AuthPublic
      - EventsPublic
      - NotificationPublic
      - SettingsPublic
      - StoryPublic

    QuotePublic:
      - Shared
      - QuotePrivate
      - AuthPublic
      - EventsPublic
      - NotificationPublic
      - SettingsPublic
      - StoryPublic
      # Registers the quotes profile tab
      - ProfilePublic

    SearchPublic:
      - Shared
      - SearchPrivate

    SettingsPublic:
      - Shared
      - SettingsPrivate

    StaticPagePublic:
      - AuthPublic
      - Shared
      - StaticPagePrivate
      - EventsPublic
      - AdministrationPublic
      - MediaPublic

    StoryPublic:
      - CommentPublic
      - Shared
      - StoryPrivate
      - StoryRefPublic
      - EventsPublic
      - AuthPublic
      - ModerationPublic
      - NotificationPublic
      - ConfigPublic
      - AdministrationPublic
      # Registers the stories and comments profile tabs
      - ProfilePublic
      # Registers the hide-comments-section user setting
      - SettingsPublic
      # Registers the chapter media usage provider with the Media GC
      - MediaPublic

    StoryRefPublic:
      - Shared
      - EventsPublic
      - AuthPublic
      - StoryRefPrivate
      - AdministrationPublic

    StatisticsPublic:
      - Shared
      - StatisticsPrivate
      - AuthPublic
      - AdministrationPublic
      - CommentPublic
      - EventsPublic
      - StoryPublic

    # ###################################################
    # Private domains - can access Shared + other domain Public APIs + events
    # ###################################################

    AdministrationPrivate:
      - Shared
      - AdministrationPublic

    AuthPrivate:
      - Shared
      - AuthPublic
      - EventsPublic
      - AdministrationPublic
      - ConfigPublic        # This dependency is necessary, but should always be lazy-loaded
      - NotificationPublic

    CalendarPrivate:
      - Shared
      - CalendarPublic
      - AuthPublic
      - StoryPublic
      - QuotePublic        # QuoteContest reads the reader's own quote book for the picker
      - NotificationPublic # QuoteContest owns its own notifications (decision #9)
      - EventsPublic
      - MediaPublic

    CommentPrivate:
      - Shared
      - AuthPublic
      - CommentPublic
      - EventsPublic
      - ModerationPublic

    ConfigPrivate:
      - Shared
      - ConfigPublic
      - AuthPublic

    DashboardPrivate:
      - Shared
      - AuthPublic
      - NewsPublic
      - ProfilePublic
      - StoryPublic
      - CommentPublic
      - ConfigPublic

    EventsPrivate:
      - Shared
      - EventsPublic
      - AuthPublic

    DiscordPrivate:
      - Shared
      - DiscordPublic
      - AuthPublic
      - EventsPublic
      - NotificationPublic

    FAQPrivate:
      - AdministrationPublic
      - AuthPublic
      - FAQPublic
      - MediaPublic
      - Shared

    HomePrivate:
      - Shared
      - AuthPublic
      - NewsPublic

    MessagePrivate:
      - Shared
      - AuthPublic
      - MessagePublic
      - EventsPublic
      - ConfigPublic

    ModerationPrivate:
      - Shared
      - ModerationPublic
      - AuthPublic
      - EventsPublic

    NewsPrivate:
      - Shared
      - AuthPublic
      # NewsCommentPolicy implements Comment's CommentPolicy contract
      - CommentPublic
      - EditorPublic
      - EventsPublic
      - MediaPublic
      - NewsPublic
      - NotificationPublic

    NotificationPrivate:
      - Shared
      - NotificationPublic
      - EventsPublic
      - AuthPublic

    ProfilePrivate:
      - Shared
      - AuthPublic
      - EventsPublic
      - MediaPublic
      - ModerationPublic
      - ProfilePublic
      - SettingsPublic

    SearchPrivate:
      - Shared
      - SearchPublic
      - StoryPublic

    SettingsPrivate:
      - Shared
      - AuthPublic
      - SettingsPublic

    FollowPrivate:
      - Shared
      - FollowPublic
      - AuthPublic
      - EventsPublic
      - NotificationPublic
      - SettingsPublic
      - StoryPublic

    ReadListPrivate:
      - Shared
      - ReadListPublic
      - AuthPublic
      - EventsPublic
      - SettingsPublic
      - StoryPublic
      - NotificationPublic
      - StoryRefPublic

    QuotePrivate:
      - Shared
      - QuotePublic
      - AuthPublic
      - EventsPublic
      - NotificationPublic
      - SettingsPublic
      - StoryPublic

    StaticPagePrivate:
      - Shared
      - AuthPublic
      - EventsPublic
      - StaticPagePublic
      - MediaPublic
      - EditorPublic

    StoryPrivate:
      - Shared
      - AuthPublic
      - CommentPublic
      - EditorPublic
      - MediaPublic
      - ModerationPublic
      - ProfilePublic
      - EventsPublic
      - StoryPublic
      - StoryRefPublic
      - NotificationPublic
      - ConfigPublic
      - SettingsPublic

    StoryRefPrivate:
      - Shared
      - EventsPublic
      - StoryRefPublic
      - AdministrationPublic

    StatisticsPrivate:
      - Shared
      - StatisticsPublic
      - AuthPublic
      - AdministrationPublic
      - CommentPublic
      - EventsPublic
      - StoryPublic

    # ###################################################
    # Domain tests - can access their own domain + Public APIs + ALL test modules for data creation
    # ###################################################
    AdministrationTests:
      - Shared
      - TestHelpers
      - AdministrationPrivate
      - AdministrationPublic

    AuthTests:
      - Shared
      - TestHelpers
      - AuthPrivate
      - AuthPublic

    CalendarTests:
      - TestHelpers
      - CalendarPrivate
      - CalendarPublic
      - AuthPublic
      - StoryPublic
      - ProfilePublic
      - Shared

    CommentTests:
      - TestHelpers
      - CommentPrivate
      - CommentPublic

    ConfigTests:
      - TestHelpers
      - ConfigPrivate
      - ConfigPublic
      - AuthPublic

    EventsTests:
      - TestHelpers
      - EventsPrivate
      - EventsPublic
      - AuthPublic
      - Shared

    DiscordTests:
      - Shared
      - TestHelpers
      - DiscordPrivate
      - DiscordPublic
      - AuthPublic
      - NotificationPublic

    FAQTests:
      - TestHelpers
      - FAQPrivate
      - FAQPublic
      - MediaPublic
      - Shared

    SearchTests:
      - Shared
      - TestHelpers
      - SearchPrivate
      - SearchPublic

    SettingsTests:
      - Shared
      - TestHelpers
      - SettingsPrivate
      - SettingsPublic

    MessageTests:
      - TestHelpers
      - MessagePrivate
      - MessagePublic

    ModerationTests:
      - TestHelpers
      - ModerationPrivate
      - ModerationPublic

    NewsTests:
      - Shared
      - TestHelpers
      - NewsPrivate
      - NewsPublic
      - AuthPublic
      - MediaPublic

    NotificationTests:
      - TestHelpers
      - NotificationPrivate
      - NotificationPublic

    ProfileTests:
      - Shared
      - TestHelpers
      - ProfilePrivate
      - ProfilePublic
      - AuthPublic

    FollowTests:
      - TestHelpers
      - FollowPrivate
      - FollowPublic
      - AuthPublic
      - StoryPublic
      - NotificationPublic

    ReadListTests:
      - TestHelpers
      - ReadListPrivate
      - ReadListPublic

    QuoteTests:
      - Shared
      - TestHelpers
      - QuotePrivate
      - QuotePublic
      - AuthPublic
      - StoryPublic
      - NotificationPublic

    StaticPageTests:
      - Shared
      - TestHelpers
      - StaticPagePrivate
      - StaticPagePublic
      - AuthPublic

    StoryTests:
      - Shared
      - TestHelpers
      - StoryPrivate
      - StoryPublic
      - AuthPublic
      - ProfilePublic
      - StoryRefPublic
      - StoryRefPrivate

    StoryRefTests:
      - Shared
      - TestHelpers
      - StoryRefPrivate
      - StoryRefPublic

    StatisticsTests:
      - Shared
      - TestHelpers
      - StatisticsPrivate
      - StatisticsPublic
      - AuthPublic
      - AdministrationPublic
      - EventsPublic
      - StoryPublic

    # Media Domain
    MediaPublic:
      - Shared
      - MediaPrivate

    MediaPrivate:
      - Shared
      - MediaPublic

    MediaTests:
      - Shared
      - TestHelpers
      - MediaPrivate
      - MediaPublic

    EditorPublic:
      - Shared
      - EditorPrivate

    EditorPrivate:
      - Shared
      - EditorPublic
      - MediaPublic

    EditorTests:
      - Shared
      - TestHelpers
      - EditorPrivate
      - EditorPublic
